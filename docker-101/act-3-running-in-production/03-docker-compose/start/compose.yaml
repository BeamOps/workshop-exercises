# Fill in each ???, then run:  docker compose up
#
# Services on the same Compose network reach each other by NAME, so the app and the
# migrate step talk to the database at host "db" (not localhost).

services:
  db:
    image: postgres:17                  # 17 keeps the classic /var/lib/postgresql/data path (18 moved it)
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starter_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]   # succeeds once Postgres accepts connections
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:???                     # where Postgres stores its data (so it survives restarts)

  migrate:
    image: starter-app:2.0
    # Run the release's migrate script (generated by mix phx.gen.release), then exit.
    command: ["bin/migrate"]
    environment:
      DATABASE_URL: ???                 # point at the "db" service by name
      SECRET_KEY_BASE: "kS3nq7wP2xR8vT1yU4zA6bC9dE0fG5hJ8kL1mN4pQ7rS0tV3wX6yZ9aB2cD5eF8gH1jK"
    depends_on:
      db:
        condition: service_healthy      # wait until the database's healthcheck passes

  app:
    image: starter-app:2.0
    ports:
      - ???                             # publish the app's port 4000 to your laptop
    environment:
      DATABASE_URL: ???
      SECRET_KEY_BASE: "kS3nq7wP2xR8vT1yU4zA6bC9dE0fG5hJ8kL1mN4pQ7rS0tV3wX6yZ9aB2cD5eF8gH1jK"
    depends_on:
      migrate:
        condition: service_completed_successfully   # wait until migrate exits 0

volumes:
  db-data:
