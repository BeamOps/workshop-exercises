# Pinned toolchain for the Terraform 101 exercises.
#
# Install mise (https://mise.jdx.dev), then from this directory run:
#
#   mise install
#
# Pins the Terraform CLI so everyone runs the same version the validators expect.
# Must be >= 1.10 for native S3 state locking (use_lockfile) in the remote-state exercise.
[tools]
terraform = "1.16.4"
